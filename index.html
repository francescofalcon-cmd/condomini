<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Spese Condominiali</title>
<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --bg: #f1f3f4;
    --card: #ffffff;
    --text: #202124;
    --text-muted: #5f6368;
    --border: #dadce0;
    --green: #34a853;
    --red: #ea4335;
    --yellow: #fbbc04;
    --shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--primary); color: #fff; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
  header h1 { font-size: 1.3rem; font-weight: 600; }
  header .stats { display: flex; gap: 1.5rem; font-size: .85rem; opacity: .9; }
  .container { max-width: 1280px; margin: 0 auto; padding: 1.5rem; }
  .toolbar { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center; }
  .toolbar select, .toolbar input, .toolbar button {
    padding: .5rem .75rem; border: 1px solid var(--border); border-radius: 6px;
    font-size: .85rem; background: var(--card);
  }
  .toolbar button { background: var(--primary); color: #fff; border: none; cursor: pointer; font-weight: 500; }
  .toolbar button:hover { background: var(--primary-dark); }
  .toolbar button.btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .toolbar button.btn-outline:hover { background: var(--primary); color: #fff; }
  .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); }
  .tabs button { padding: .7rem 1.5rem; border: none; background: none; cursor: pointer; font-size: .9rem; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -2px; font-weight: 500; }
  .tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }
  .panel { display: none; }
  .panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
  th { background: #f8f9fa; font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .3px; color: var(--text-muted); text-align: left; padding: .75rem 1rem; position: sticky; top: 0; }
  td { padding: .65rem 1rem; border-top: 1px solid var(--border); font-size: .85rem; }
  tr:hover td { background: #f8f9fa; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .75rem; font-weight: 500; }
  .badge-ok { background: #e6f4ea; color: var(--green); }
  .badge-pending { background: #fef7e0; color: #b06000; }
  .badge-overdue { background: #fce8e6; color: var(--red); }
  .amount { font-weight: 600; font-variant-numeric: tabular-nums; }
  .amount.negative { color: var(--red); }
  .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .summary-card { background: var(--card); border-radius: 8px; padding: 1.2rem; box-shadow: var(--shadow); }
  .summary-card .label { font-size: .75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .3px; }
  .summary-card .value { font-size: 1.5rem; font-weight: 700; margin-top: .25rem; }
  .summary-card .sub { font-size: .8rem; color: var(--text-muted); margin-top: .15rem; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; justify-content: center; align-items: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); border-radius: 12px; padding: 1.5rem; width: 90%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
  .modal h2 { font-size: 1.1rem; margin-bottom: 1rem; }
  .form-group { margin-bottom: .85rem; }
  .form-group label { display: block; font-size: .8rem; font-weight: 500; margin-bottom: .25rem; color: var(--text-muted); }
  .form-group input, .form-group select { width: 100%; padding: .5rem; border: 1px solid var(--border); border-radius: 6px; font-size: .85rem; }
  .modal-actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1.2rem; }
  .modal-actions button { padding: .5rem 1.2rem; border-radius: 6px; border: none; cursor: pointer; font-size: .85rem; font-weight: 500; }
  .modal-actions .btn-save { background: var(--primary); color: #fff; }
  .modal-actions .btn-cancel { background: transparent; color: var(--text-muted); }
  .progress-bar { height: 6px; background: #e8eaed; border-radius: 3px; overflow: hidden; }
  .progress-bar .fill { height: 100%; border-radius: 3px; transition: width .3s; }
  .fill-green { background: var(--green); }
  .fill-yellow { background: var(--yellow); }
  .fill-red { background: var(--red); }
  .quota-input { width: 80px; padding: .3rem .4rem; border: 1px solid var(--border); border-radius: 5px; font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; }
  .quota-input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  .inline-actions .btn-outline { padding: 2px 8px; font-size: .72rem; }
  @media (max-width: 768px) {
    header { padding: .75rem 1rem; }
    .container { padding: 1rem; }
    th, td { padding: .5rem .6rem; font-size: .78rem; }
  }
</style>
</head>
<body>

<header>
  <h1>&#127970; Gestione Spese Condominiali</h1>
  <div class="stats">
    <span id="hTotPalazzine"></span>
    <span id="hTotFamiglie"></span>
    <span id="hTotSpese"></span>
  </div>
</header>

<div class="container">
  <div class="summary-cards" id="summaryCards"></div>

  <div class="tabs">
    <button class="active" onclick="showTab('riepilogo')">Riepilogo Palazzine</button>
    <button onclick="showTab('dettaglio')">Dettaglio Famiglie</button>
    <button onclick="showTab('spese')">Elenco Spese</button>
  </div>

  <!-- TAB: RIEPILOGO -->
  <div class="panel active" id="panel-riepilogo">
    <table>
      <thead>
        <tr>
          <th>Palazzina</th>
          <th>Famiglie</th>
          <th>Spesa Totale Annuale</th>
          <th>Media per Famiglia</th>
          <th>Rate Versate</th>
          <th>Saldo</th>
        </tr>
      </thead>
      <tbody id="riepilogoBody"></tbody>
    </table>
  </div>

  <!-- TAB: DETTAGLIO FAMIGLIE -->
  <div class="panel" id="panel-dettaglio">
    <div class="toolbar">
      <select id="filterPalazzina" onchange="renderFamiglie()">
        <option value="all">Tutte le palazzine</option>
      </select>
      <select id="filterStato" onchange="renderFamiglie()">
        <option value="all">Tutti gli stati</option>
        <option value="aggiornato">Aggiornato</option>
        <option value="in_attesa">In attesa</option>
        <option value="in_ritardo">In ritardo</option>
      </select>
      <input type="text" id="searchFamiglia" placeholder="Cerca famiglia..." oninput="renderFamiglie()">
      <button class="btn-outline" onclick="openModal('famiglia')">+ Nuova Famiglia</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Palazzina</th>
          <th>Interno</th>
          <th>Famiglia</th>
          <th>Quota Mensile</th>
          <th>Spesa Annua</th>
          <th>Rate Pagate / 12</th>
          <th>Importo Versato</th>
          <th>Residuo</th>
          <th>Stato</th>
        </tr>
      </thead>
      <tbody id="famiglieBody"></tbody>
    </table>
  </div>

  <!-- TAB: SPESE -->
  <div class="panel" id="panel-spese">
    <div class="toolbar">
      <select id="filterSpesePalazzina" onchange="renderSpese()">
        <option value="all">Tutte le palazzine</option>
      </select>
      <select id="filterCategoria" onchange="renderSpese()">
        <option value="all">Tutte le categorie</option>
      </select>
      <button class="btn-outline" onclick="openModal('spesa')">+ Nuova Spesa</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Palazzina</th>
          <th>Categoria</th>
          <th>Descrizione</th>
          <th>Importo</th>
          <th>Per Famiglia</th>
          <th>Azioni</th>
        </tr>
      </thead>
      <tbody id="speseBody"></tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const PALAZZINE_NOMI = [
  'Viale Roma','Via Garibaldi','Via Mazzini','Piazza Dante','Corso Vittorio',
  'Via Carducci','Via Manzoni','Via Leopardi','Via Foscolo','Via Pascoli'
];
const CATEGORIE = ['Luce comune','Gas','Acqua','Ascensore','Portierato','Pulizia','Manutenzione','Assicurazione','Amministrazione','Altro'];
const MESE = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];

let palazzine = [];
let spese = [];

function init() {
  palazzine = PALAZZINE_NOMI.map((nome, i) => {
    const famiglie = [];
    const scale = Math.random() < .5 ? ['A','B'] : ['A','B','C'];
    let progressivo = 1;
    for (const scala of scale) {
      const nFam = scale.length === 2 ? 8 : 5;
      for (let f = 0; f < nFam && famiglie.length < 15; f++) {
        const ratePagate = Math.floor(Math.random() * 13);
        const quotaMensile = 80 + Math.floor(Math.random() * 180);
        famiglie.push({
          id: `${i}-${famiglie.length}`,
          interno: `${scala}${progressivo}`,
          nome: generaNome(),
          quotaMensile,
          ratePagate,
          versato: ratePagate * quotaMensile,
          spesaAnnua: quotaMensile * 12
        });
        progressivo++;
      }
    }
    return { id: i, nome, famiglie, scala: scale };
  });

  spese = [];
  const anni = [2025, 2026];
  for (const a of anni) {
    for (let m = 0; m < 9; m++) {
      const numSpese = 2 + Math.floor(Math.random() * 4);
      for (let s = 0; s < numSpese; s++) {
        const palId = Math.floor(Math.random() * 10);
        const cat = CATEGORIE[Math.floor(Math.random() * CATEGORIE.length)];
        const imp = 50 + Math.floor(Math.random() * 3000);
        const nFam = palazzine[palId].famiglie.length;
        spese.push({
          id: spese.length,
          data: `${a}-${String(m+1).padStart(2,'0')}-${String(1+Math.floor(Math.random()*28)).padStart(2,'0')}`,
          palazzinaId: palId,
          categoria: cat,
          descrizione: descrizioneSpesa(cat),
          importo: imp,
          perFamiglia: +(imp / nFam).toFixed(2)
        });
      }
    }
  }

  const selP = document.getElementById('filterPalazzina');
  const selS = document.getElementById('filterSpesePalazzina');
  const selCat = document.getElementById('filterCategoria');
  palazzine.forEach(p => {
    selP.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
    selS.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
  });
  CATEGORIE.forEach(c => { selCat.innerHTML += `<option value="${c}">${c}</option>`; });

  renderAll();
}

function generaNome() {
  const n = ['Rossi','Bianchi','Romano','Colombo','Ferrari','Esposito','Ricci','Marino','Greco','Bruno','Gallo','Conti','De Luca','Mancini','Costa','Giordano','Rizzo','Lombardi','Moretti','Barbieri','Fontana','Santoro','Mariani','Rinaldi','Caruso'];
  return n[Math.floor(Math.random() * n.length)];
}

function descrizioneSpesa(cat) {
  const m = {
    'Luce comune': ['Illuminazione scale','Luce giardino','Luce garage','Illuminazione cortile'],
    'Gas': ['Riscaldamento invernale','Acqua calda'],
    'Acqua': ['Acqua verde','Acqua potabile'],
    'Ascensore': ['Manutenzione ascensore','Revisione periodica'],
    'Portierato': ['Stipendio portiere','Straordinario portiere'],
    'Pulizia': ['Pulizia scale','Pulizia giardino','Pulizia tettoia','Sanificazione'],
    'Manutenzione': ['Tetto','Infissi','Cortile','Tubi comuni','Pavimentazione'],
    'Assicurazione': ['Polizza RC','Polizza incendio'],
    'Amministrazione': ['Compensi amministratore','Bollo gestione','Consulenza'],
    'Altro': ['Spese varie','Consulenza legale','Cassette postali']
  };
  const arr = m[cat] || ['Spesa generica'];
  return arr[Math.floor(Math.random() * arr.length)];
}

function renderAll() {
  renderSummary();
  renderRiepilogo();
  renderFamiglie();
  renderSpese();
  renderHeader();
}

function renderHeader() {
  const totFam = palazzine.reduce((s, p) => s + p.famiglie.length, 0);
  const totSpesa = spese.reduce((s, sp) => s + sp.importo, 0);
  document.getElementById('hTotPalazzine').textContent = `10 palazzine`;
  document.getElementById('hTotFamiglie').textContent = `${totFam} famiglie`;
  document.getElementById('hTotSpese').textContent = `€ ${totSpesa.toLocaleString('it-IT')}`;
}

function renderSummary() {
  const totSpesa = spese.reduce((s, sp) => s + sp.importo, 0);
  const totFam = palazzine.reduce((s, p) => s + p.famiglie.length, 0);
  const totVersato = palazzine.reduce((s, p) => s + p.famiglie.reduce((sf, f) => sf + f.versato, 0), 0);
  const totDovuto = palazzine.reduce((s, p) => s + p.famiglie.reduce((sf, f) => sf + f.spesaAnnua, 0), 0);
  const aggiornate = palazzine.reduce((s, p) => s + p.famiglie.filter(f => f.ratePagate === 12).length, 0);
  const inRitardo = palazzine.reduce((s, p) => s + p.famiglie.filter(f => f.ratePagate <= 8).length, 0);

  document.getElementById('summaryCards').innerHTML = `
    <div class="summary-card">
      <div class="label">Spesa Totale Documentata</div>
      <div class="value">€ ${totSpesa.toLocaleString('it-IT')}</div>
      <div class="sub">da ${spese.length} documenti</div>
    </div>
    <div class="summary-card">
      <div class="label">Totale Versato dalle Famiglie</div>
      <div class="value" style="color:var(--green)">€ ${totVersato.toLocaleString('it-IT')}</div>
      <div class="sub">su € ${totDovuto.toLocaleString('it-IT')} dovuti</div>
    </div>
    <div class="summary-card">
      <div class="label">Saldo Complessivo</div>
      <div class="value" style="color:${totVersato >= totDovuto ? 'var(--green)' : 'var(--red)'}">€ ${(totVersato - totDovuto).toLocaleString('it-IT')}</div>
      <div class="sub">${totVersato >= totDovuto ? 'In pari' : 'Da riscuotere'}</div>
    </div>
    <div class="summary-card">
      <div class="label">Famiglie Aggiornate</div>
      <div class="value">${aggiornate} / ${totFam}</div>
      <div class="progress-bar" style="margin-top:.4rem"><div class="fill fill-green" style="width:${(aggiornate/totFam*100).toFixed(0)}%"></div></div>
    </div>
    <div class="summary-card">
      <div class="label">Famiglie in Ritardo</div>
      <div class="value" style="color:${inRitardo > 0 ? 'var(--red)' : 'inherit'}">${inRitardo} / ${totFam}</div>
      <div class="progress-bar" style="margin-top:.4rem"><div class="fill fill-red" style="width:${(inRitardo/totFam*100).toFixed(0)}%"></div></div>
    </div>
  `;
}

function renderRiepilogo() {
  const tbody = document.getElementById('riepilogoBody');
  tbody.innerHTML = palazzine.map(p => {
    const totSpesa = p.famiglie.reduce((s, f) => s + f.spesaAnnua, 0);
    const totVersato = p.famiglie.reduce((s, f) => s + f.versato, 0);
    const media = (totSpesa / p.famiglie.length).toFixed(0);
    const ratePagate = p.famiglie.reduce((s, f) => s + f.ratePagate, 0);
    const rateTotali = p.famiglie.length * 12;
    const saldo = totVersato - totSpesa;
    const pctRate = (ratePagate / rateTotali * 100).toFixed(0);
    const colorClass = saldo >= 0 ? 'fill-green' : saldo > -500 ? 'fill-yellow' : 'fill-red';
    return `<tr>
      <td><strong>${p.nome}</strong></td>
      <td>${p.famiglie.length}</td>
      <td class="amount">€ ${totSpesa.toLocaleString('it-IT')}</td>
      <td class="amount">€ ${Number(media).toLocaleString('it-IT')}</td>
      <td>
        <div style="font-size:.8rem">${ratePagate} / ${rateTotali} (${pctRate}%)</div>
        <div class="progress-bar"><div class="fill ${pctRate > 80 ? 'fill-green' : pctRate > 50 ? 'fill-yellow' : 'fill-red'}" style="width:${pctRate}%"></div></div>
      </td>
      <td class="amount ${saldo < 0 ? 'negative' : ''}">€ ${saldo.toLocaleString('it-IT')}</td>
    </tr>`;
  }).join('');
}

function renderFamiglie() {
  const palFilter = document.getElementById('filterPalazzina').value;
  const statoFilter = document.getElementById('filterStato').value;
  const search = document.getElementById('searchFamiglia').value.toLowerCase();

  let rows = [];
  for (const p of palazzine) {
    if (palFilter !== 'all' && String(p.id) !== palFilter) continue;
    for (const f of p.famiglie) {
      if (search && !f.nome.toLowerCase().includes(search)) continue;
      let stato = f.ratePagate === 12 ? 'aggiornato' : f.ratePagate >= 9 ? 'in_attesa' : 'in_ritardo';
      if (statoFilter !== 'all' && stato !== statoFilter) continue;
      const residuo = f.spesaAnnua - f.versato;
      const badgeClass = stato === 'aggiornato' ? 'badge-ok' : stato === 'in_attesa' ? 'badge-pending' : 'badge-overdue';
      const badgeText = stato === 'aggiornato' ? 'Aggiornato' : stato === 'in_attesa' ? 'In attesa' : 'In ritardo';
      rows.push(`<tr>
        <td>${p.nome}</td>
        <td>${f.interno}</td>
        <td><strong>${f.nome}</strong></td>
        <td>
          <input class="quota-input" type="number" min="1" step="0.01" value="${f.quotaMensile}"
                 onchange="aggiornaQuota('${p.id}','${f.id}',this.value)">
        </td>
        <td class="amount">€ ${f.spesaAnnua.toLocaleString('it-IT')}</td>
        <td>${f.ratePagate} / 12</td>
        <td class="amount">€ ${f.versato.toLocaleString('it-IT')}</td>
        <td class="amount ${residuo > 0 ? 'negative' : ''}">€ ${residuo.toLocaleString('it-IT')}</td>
        <td><span class="badge ${badgeClass}">${badgeText}</span></td>
      </tr>`);
    }
  }
  document.getElementById('famiglieBody').innerHTML = rows.join('') || '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:2rem">Nessun risultato</td></tr>';
}

function renderSpese() {
  const palFilter = document.getElementById('filterSpesePalazzina').value;
  const catFilter = document.getElementById('filterCategoria').value;

  let rows = spese.filter(s => {
    if (palFilter !== 'all' && String(s.palazzinaId) !== palFilter) return false;
    if (catFilter !== 'all' && s.categoria !== catFilter) return false;
    return true;
  }).sort((a, b) => b.data.localeCompare(a.data));

  document.getElementById('speseBody').innerHTML = rows.map(s => `<tr>
    <td>${formatDate(s.data)}</td>
    <td>${palazzine[s.palazzinaId].nome}</td>
    <td>${s.categoria}</td>
    <td>${s.descrizione}</td>
    <td class="amount">€ ${s.importo.toLocaleString('it-IT')}</td>
    <td class="amount">€ ${s.perFamiglia.toLocaleString('it-IT')}</td>
    <td><button class="btn-outline" style="padding:2px 8px;font-size:.75rem" onclick="eliminaSpesa(${s.id})">Elimina</button></td>
  </tr>`).join('');
}

function formatDate(d) {
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function eliminaSpesa(id) {
  spese = spese.filter(s => s.id !== id);
  renderAll();
}

function showTab(tab) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

function openModal(type) {
  const modal = document.getElementById('modalContent');
  if (type === 'spesa') {
    let opts = palazzine.map(p => `<option value="${p.id}">${p.nome} (${p.famiglie.length} fam.)</option>`).join('');
    let catOpts = CATEGORIE.map(c => `<option value="${c}">${c}</option>`).join('');
    modal.innerHTML = `
      <h2>Nuova Spesa</h2>
      <div class="form-group"><label>Data</label><input type="date" id="mData" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="form-group"><label>Palazzina</label><select id="mPalazzina">${opts}</select></div>
      <div class="form-group"><label>Categoria</label><select id="mCategoria">${catOpts}</select></div>
      <div class="form-group"><label>Descrizione</label><input type="text" id="mDescrizione" placeholder="Descrizione spesa"></div>
      <div class="form-group"><label>Importo (€)</label><input type="number" id="mImporto" min="0" step="0.01"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Annulla</button>
        <button class="btn-save" onclick="salvaSpesa()">Salva</button>
      </div>`;
  } else if (type === 'famiglia') {
    let opts = palazzine.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
    modal.innerHTML = `
      <h2>Nuova Famiglia</h2>
      <div class="form-group"><label>Palazzina</label><select id="mFamPalazzina">${opts}</select></div>
      <div class="form-group"><label>Interno</label><input type="text" id="mFamInterno" placeholder="Es. A5"></div>
      <div class="form-group"><label>Nome Famiglia</label><input type="text" id="mFamNome" placeholder="Cognome"></div>
      <div class="form-group"><label>Quota Mensile (€)</label><input type="number" id="mFamQuota" min="1" step="0.01"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Annulla</button>
        <button class="btn-save" onclick="salvaFamiglia()">Salva</button>
      </div>`;
  }
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function salvaSpesa() {
  const data = document.getElementById('mData').value;
  const palId = Number(document.getElementById('mPalazzina').value);
  const cat = document.getElementById('mCategoria').value;
  const desc = document.getElementById('mDescrizione').value || cat;
  const imp = Number(document.getElementById('mImporto').value);
  if (!data || !imp) return alert('Compila tutti i campi');
  const nFam = palazzine[palId].famiglie.length;
  spese.push({ id: spese.length, data, palazzinaId: palId, categoria: cat, descrizione: desc, importo: imp, perFamiglia: +(imp / nFam).toFixed(2) });
  closeModal();
  renderAll();
}

function aggiornaQuota(palId, famId, val) {
  const quota = Number(val);
  if (!quota || quota < 0) { renderFamiglie(); return; }
  const p = palazzine[palId];
  const f = p.famiglie.find(x => x.id === famId);
  if (!f) return;
  f.quotaMensile = quota;
  f.spesaAnnua = quota * 12;
  f.versato = f.ratePagate * quota;
  renderAll();
}

function salvaFamiglia() {
  const palId = Number(document.getElementById('mFamPalazzina').value);
  const interno = document.getElementById('mFamInterno').value.trim();
  const nome = document.getElementById('mFamNome').value.trim();
  const quota = Number(document.getElementById('mFamQuota').value);
  if (!interno || !nome || !quota || quota < 0) return alert('Compila tutti i campi (quota maggiore di 0)');
  const p = palazzine[palId];
  if (p.famiglie.some(f => f.interno === interno)) return alert('Interno già esistente in questa palazzina');
  const ratePagate = Math.floor(Math.random() * 4);
  p.famiglie.push({
    id: `${palId}-${p.famiglie.length}`,
    interno,
    nome,
    quotaMensile: quota,
    ratePagate,
    versato: ratePagate * quota,
    spesaAnnua: quota * 12
  });
  closeModal();
  renderAll();
}

init();
</script>
</body>
</html>
